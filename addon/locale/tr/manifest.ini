summary = "Ek Ayarlar"
description = "Web gezinme döngüsü, web sayfalarında boş satırları atlama, pano bildirimleri, konuşma geçmişi, uygulama tuşu yerine kısayol, panoya metin ekleme, seçili metin sayımı, panodaki metin/tablo/dosya bilgilerini inceleme, klasör ve web sayfası yer imleri, Hızlı bul ile belgeye özel kısayollarla kayıtlı metin konumlarına gitme, sayısal tuş takımıyla gezinme, satır çevirisi ve otomatik satır çevirisi için NVDA ayarları."
